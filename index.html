<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A small drawing app, built one step at a time." />
    <title>MakiDraw</title>
  </head>
  <body>
    <main>
      <div class="toolbar" role="toolbar" aria-label="Drawing tools">
        <div class="tool-controls" role="group" aria-label="Shape">
          <button
            class="square-button tool-button"
            type="button"
            data-tool="line"
            aria-label="Line"
            aria-pressed="true"
            title="Line (L)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 19 19 5" />
            </svg>
          </button>
          <button
            class="square-button tool-button"
            type="button"
            data-tool="rectangle"
            aria-label="Rectangle"
            aria-pressed="false"
            title="Rectangle (R)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="5" width="16" height="14" rx="1" />
            </svg>
          </button>
          <button
            class="square-button tool-button"
            type="button"
            data-tool="ellipse"
            aria-label="Ellipse"
            aria-pressed="false"
            title="Ellipse (E)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <ellipse cx="12" cy="12" rx="8" ry="6" />
            </svg>
          </button>
          <button
            class="square-button tool-button"
            type="button"
            data-tool="text"
            aria-label="Text"
            aria-pressed="false"
            title="Text (T)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6h12M12 6v12" />
            </svg>
          </button>
        </div>
        <div class="color-controls" role="group" aria-label="Stroke color">
          <button
            class="square-button color-button"
            type="button"
            data-color="black"
            aria-label="Black"
            aria-pressed="true"
            title="Black"
          ></button>
          <button
            class="square-button color-button"
            type="button"
            data-color="red"
            aria-label="Red"
            aria-pressed="false"
            title="Red"
          ></button>
          <button
            class="square-button color-button"
            type="button"
            data-color="blue"
            aria-label="Blue"
            aria-pressed="false"
            title="Blue"
          ></button>
          <button
            class="square-button color-button"
            type="button"
            data-color="green"
            aria-label="Green"
            aria-pressed="false"
            title="Green"
          ></button>
        </div>
        <div class="action-controls">
          <button id="undo" type="button" disabled>Undo</button>
          <button id="clear" type="button" disabled>Clear</button>
        </div>
      </div>
      <div class="canvas-container">
        <canvas id="drawing" width="800" height="500" aria-label="Drawing area">
          Your browser does not support canvas.
        </canvas>
        <input
          id="text-editor"
          class="text-editor"
          type="text"
          aria-label="Drawing text"
          autocomplete="off"
          hidden
        />
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
