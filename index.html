<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A small drawing app, built one step at a time." />
    <title>MakiDraw</title>
  </head>
  <body>
    <main>
      <div class="toolbar" role="toolbar" aria-label="Drawing tools">
        <div class="tool-controls" role="group" aria-label="Shape">
          <button
            class="square-button tool-button"
            type="button"
            data-tool="select"
            aria-label="Select"
            aria-pressed="false"
            title="Select (V)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m5 4 6.5 15 2.25-6.25L20 10.5 5 4Z" />
            </svg>
          </button>
          <button
            class="square-button tool-button"
            type="button"
            data-tool="line"
            aria-label="Line"
            aria-pressed="true"
            title="Line (L)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 19 19 5" />
            </svg>
          </button>
          <button
            class="square-button tool-button"
            type="button"
            data-tool="rectangle"
            aria-label="Rectangle"
            aria-pressed="false"
            title="Rectangle (R)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="5" width="16" height="14" rx="1" />
            </svg>
          </button>
          <button
            class="square-button tool-button"
            type="button"
            data-tool="ellipse"
            aria-label="Ellipse"
            aria-pressed="false"
            title="Ellipse (E)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <ellipse cx="12" cy="12" rx="8" ry="6" />
            </svg>
          </button>
          <button
            class="square-button tool-button"
            type="button"
            data-tool="text"
            aria-label="Text"
            aria-pressed="false"
            title="Text (T)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6h12M12 6v12" />
            </svg>
          </button>
        </div>
        <div class="color-controls" role="group" aria-label="Stroke color">
          <button
            class="square-button color-button"
            type="button"
            data-color="black"
            aria-label="Black"
            aria-pressed="true"
            title="Black (1)"
          ></button>
          <button
            class="square-button color-button"
            type="button"
            data-color="red"
            aria-label="Red"
            aria-pressed="false"
            title="Red (2)"
          ></button>
          <button
            class="square-button color-button"
            type="button"
            data-color="blue"
            aria-label="Blue"
            aria-pressed="false"
            title="Blue (3)"
          ></button>
          <button
            class="square-button color-button"
            type="button"
            data-color="green"
            aria-label="Green"
            aria-pressed="false"
            title="Green (4)"
          ></button>
        </div>
        <div class="layer-controls" role="group" aria-label="Layer order">
          <button
            class="square-button icon-button"
            id="send-to-back"
            type="button"
            aria-label="Send selected shape to back"
            title="Send selected shape to back"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="4" width="10" height="10" rx="2" />
              <path d="M5 8v11m0 0-3-3m3 3 3-3" />
              <path d="M9 18h6a2 2 0 0 0 2-2" />
            </svg>
          </button>
          <button
            class="square-button icon-button"
            id="bring-to-front"
            type="button"
            aria-label="Bring selected shape to front"
            title="Bring selected shape to front"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10" width="10" height="10" rx="2" />
              <path d="M19 16V5m0 0-3 3m3-3 3 3" />
              <path d="M15 6H9a2 2 0 0 0-2 2" />
            </svg>
          </button>
        </div>
        <div class="action-controls" role="group" aria-label="Drawing actions">
          <button
            class="square-button icon-button"
            id="undo"
            type="button"
            aria-label="Undo"
            title="Undo (Ctrl+Z)"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m8 7-4 4 4 4" />
              <path d="M5 11h8a6 6 0 0 1 6 6" />
            </svg>
          </button>
          <button
            class="square-button icon-button"
            id="clear"
            type="button"
            aria-label="Clear drawing"
            title="Clear drawing"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M9 4h6l1 3H8l1-3Z" />
              <path d="m7 7 1 13h8l1-13M10 11v5M14 11v5" />
            </svg>
          </button>
        </div>
      </div>
      <div class="canvas-container">
        <canvas id="drawing" width="800" height="500" aria-label="Drawing area">
          Your browser does not support canvas.
        </canvas>
        <input
          id="text-editor"
          class="text-editor"
          type="text"
          aria-label="Drawing text"
          autocomplete="off"
          hidden
        />
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
