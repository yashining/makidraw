<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A small drawing app, built one step at a time." />
    <title>MakiDraw</title>
  </head>
  <body>
    <main>
      <div class="toolbar" role="toolbar" aria-label="Drawing tools">
        <button type="button" data-tool="line" aria-pressed="true">Line</button>
        <button type="button" data-tool="rectangle" aria-pressed="false">
          Rectangle
        </button>
        <button type="button" data-tool="ellipse" aria-pressed="false">
          Ellipse
        </button>
      </div>
      <canvas id="drawing" width="800" height="500" aria-label="Drawing area">
        Your browser does not support canvas.
      </canvas>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
